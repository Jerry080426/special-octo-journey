<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070A10" />
  <title>关系地图 · 两种进入方式</title>
  <style>
    :root {
      --bg: #070a10;
      --ink: #edeae3;
      --muted: #8e97a3;
      --amber: #e8b26a;
      --line: rgba(237, 234, 227, 0.12);
      --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(900px 700px at 50% 18%, #151c29 0%, #080c13 58%, #05070b 100%);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body.in-mode {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    #chooser {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      overflow: auto;
    }

    #chooser::before {
      content: "";
      position: fixed;
      inset: -10%;
      pointer-events: none;
      background:
        radial-gradient(520px 420px at 18% 24%, rgba(232, 178, 106, 0.12), transparent 68%),
        radial-gradient(560px 460px at 82% 28%, rgba(124, 147, 184, 0.12), transparent 68%),
        radial-gradient(520px 420px at 55% 88%, rgba(155, 138, 184, 0.09), transparent 68%);
      filter: blur(30px);
    }

    .chooser-inner {
      position: relative;
      z-index: 1;
      width: min(1000px, 100%);
    }

    .head {
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .head h1 {
      margin: 10px 0 8px;
      font-family: var(--serif);
      font-size: clamp(42px, 6vw, 64px);
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #f3efe6;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 0.05em;
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .mode {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 340px;
      padding: 26px 28px 24px;
      overflow: hidden;
      border: 1px solid rgba(237, 234, 227, 0.12);
      border-radius: 2px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012));
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s, background 0.35s;
    }

    .mode:hover {
      transform: translateY(-4px);
      border-color: rgba(232, 178, 106, 0.4);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.018));
    }

    .mode:focus-visible {
      outline: 1px solid var(--amber);
      outline-offset: 4px;
    }

    .mode-no {
      color: var(--amber);
      font-size: 9px;
      letter-spacing: 0.24em;
    }

    .mode-art {
      display: block;
      height: 92px;
      margin: 18px 0 20px;
      color: var(--muted);
    }

    .mode-art svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .mode-kicker {
      color: var(--muted);
      font-size: 8.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .mode-title {
      margin: 7px 0 8px;
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #f2eee5;
    }

    .mode-desc {
      margin: 0;
      max-width: 320px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.85;
      letter-spacing: 0.03em;
    }

    .mode-enter {
      margin-top: auto;
      padding-top: 20px;
      color: var(--amber);
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .fine {
      margin: 24px 0 0;
      color: rgba(142, 151, 163, 0.65);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-align: center;
    }

    #frames {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: transparent;
      pointer-events: none;
    }

    .app-frame {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
      pointer-events: auto;
    }

    .switch {
      position: fixed;
      right: 22px;
      bottom: 20px;
      z-index: 100;
      padding: 9px 15px;
      border: 1px solid rgba(237, 234, 227, 0.16);
      border-radius: 999px;
      background: rgba(11, 16, 24, 0.78);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #b9c0c9;
      font-size: 10px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
    }

    .switch:hover {
      color: var(--ink);
      border-color: rgba(237, 234, 227, 0.34);
      background: rgba(18, 24, 34, 0.9);
    }

    @media (max-width: 720px) {
      #chooser {
        padding: 28px 18px;
        place-items: start center;
      }

      .head h1 {
        font-size: 40px;
      }

      .modes {
        grid-template-columns: 1fr;
      }

      .mode {
        min-height: 250px;
        padding: 20px 20px 18px;
      }

      .mode-art {
        height: 66px;
        margin: 12px 0 14px;
      }

      .mode-title {
        font-size: 25px;
      }

      .switch {
        right: 14px;
        bottom: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="chooser">
    <div class="chooser-inner">
      <header class="head">
        <p class="eyebrow">RELATIONSHIP MAP · TWO WAYS IN</p>
        <h1>关系地图</h1>
        <p class="sub">一张可以走进去的地图，和一段三分钟的夜路。<br />两种方式，同一套五段关系。</p>
      </header>

      <main class="modes">
        <button class="mode" type="button" data-mode="map">
          <span class="mode-no">01</span>
          <span class="mode-art" aria-hidden="true">
            <svg viewBox="0 0 320 92" fill="none">
              <circle cx="160" cy="46" r="5" fill="#E8B26A" />
              <circle cx="80" cy="22" r="3.2" fill="#7C93B8" />
              <circle cx="62" cy="66" r="3.2" fill="#E8B26A" />
              <circle cx="250" cy="24" r="3.2" fill="#7FA88B" />
              <circle cx="258" cy="68" r="3.2" fill="#9B8AB8" />
              <circle cx="176" cy="14" r="3.2" fill="#C9D6E3" />
              <path d="M160 46L80 22M160 46L62 66M160 46L250 24M160 46L258 68M160 46L176 14" stroke="rgba(237,234,227,.18)" stroke-width="1" />
              <circle cx="160" cy="46" r="18" stroke="rgba(232,178,106,.25)" />
              <circle cx="160" cy="46" r="30" stroke="rgba(232,178,106,.1)" />
            </svg>
          </span>
          <span class="mode-kicker">文字互动</span>
          <span class="mode-title">关系星图</span>
          <span class="mode-desc">五段关系，三种回应，回声板与一张可以带走的星图。</span>
          <span class="mode-enter">进入地图 →</span>
        </button>

        <button class="mode" type="button" data-mode="game">
          <span class="mode-no">02</span>
          <span class="mode-art" aria-hidden="true">
            <svg viewBox="0 0 320 92" fill="none">
              <path d="M60 66C95 66 112 46 145 46S200 62 230 38" stroke="rgba(232,178,106,.22)" stroke-width="1" stroke-dasharray="3 7" />
              <circle cx="145" cy="46" r="5" fill="#F6E4C8" />
              <circle cx="145" cy="46" r="17" stroke="rgba(232,178,106,.4)" />
              <circle cx="145" cy="46" r="29" stroke="rgba(232,178,106,.14)" />
              <circle cx="76" cy="26" r="2.6" fill="#C9D6E3" />
              <circle cx="238" cy="26" r="2.6" fill="#7FA88B" />
              <circle cx="248" cy="66" r="2.6" fill="#9B8AB8" />
            </svg>
          </span>
          <span class="mode-kicker">夜行模式</span>
          <span class="mode-title">带一束光回家</span>
          <span class="mode-desc">三分钟，走近三个人，按住停留，带回三束光，再回到中心。</span>
          <span class="mode-enter">开始夜行 →</span>
        </button>
      </main>

      <p class="fine">单文件版 · 所有内容都在这个 HTML 里 · 无需联网</p>
    </div>
  </div>

  <div id="frames"></div>
  <button id="switchBtn" class="switch" type="button" hidden>切换模式</button>

    const DOCS = { map: MAIN_B64, game: GAME_B64 };
    const frames = {};
    const chooser = document.getElementById("chooser");
    const framesEl = document.getElementById("frames");
    const switchBtn = document.getElementById("switchBtn");

    function b64ToUtf8(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    function show(mode) {
      if (!DOCS[mode]) return;

      chooser.hidden = true;
      switchBtn.hidden = false;
      document.body.classList.add("in-mode");

      if (!frames[mode]) {
        const f = document.createElement("iframe");
        f.className = "app-frame";
        f.title = mode === "map" ? "关系星图" : "带一束光回家";
        f.srcdoc = b64ToUtf8(DOCS[mode]);
        framesEl.appendChild(f);
        frames[mode] = f;
      }

      Object.keys(frames).forEach((key) => {
        frames[key].style.display = key === mode ? "block" : "none";
      });

      window.requestAnimationFrame(() => {
        const f = frames[mode];
        try {
          f.contentWindow.dispatchEvent(new Event("resize"));
          f.contentWindow.focus();
        } catch (err) {
          /* ignore */
        }
      });

      if (location.hash !== "#" + mode) {
        history.replaceState(null, "", "#" + mode);
      }
    }

    function openChooser() {
      Object.keys(frames).forEach((key) => {
        frames[key].style.display = "none";
      });
      chooser.hidden = false;
      switchBtn.hidden = true;
      document.body.classList.remove("in-mode");
      history.replaceState(null, "", location.pathname + location.search);
    }

    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => show(btn.dataset.mode));
    });

    switchBtn.addEventListener("click", openChooser);

    const initial = location.hash.replace("#", "");
    if (initial === "map" || initial === "game") {
      window.setTimeout(() => show(initial), 40);
    }
  </script>
